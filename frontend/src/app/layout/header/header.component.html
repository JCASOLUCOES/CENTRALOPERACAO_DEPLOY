<ng-container *ngIf="authInitialized$ | async; else authLoading">
  <nav class="top-bar" aria-label="Cabeçalho principal">
    <!-- Linha principal: marca | busca global | usuário -->
    <div class="top-bar__row">
      <div class="top-bar__left">
        <button
          type="button"
          class="icon-btn"
          (click)="toggleSidebar.emit()"
          aria-label="Alternar menu lateral"
          title="Alternar menu lateral"
        >
          <i class="bi bi-list" aria-hidden="true"></i>
        </button>

        <a class="navbar-brand" routerLink="/" aria-label="Ir para a página inicial">
          <img [src]="appConfig.logo" [alt]="appConfig.nomeCurto" />
          <div class="brand-text">
            <span class="title">{{ appConfig.nomeCurto }}</span>
            <small>{{ appConfig.subtitulo }}</small>
          </div>
        </a>
      </div>

      <div class="top-bar__center">
        <app-global-search
          origem="header"
          variante="header"
          placeholder="Pesquisar qualquer conteúdo..."
          label="Buscar na Central"
        ></app-global-search>
      </div>

      <div class="top-bar__right">
        <ul class="navbar-nav align-items-center">
          <li class="nav-item">
            <button
              class="theme-toggle"
              type="button"
              [attr.aria-label]="isDark ? 'Ativar modo claro' : 'Ativar modo escuro'"
              [title]="isDark ? 'Modo claro' : 'Modo escuro'"
              (click)="toggleTheme()"
            >
              <i class="bi" [ngClass]="isDark ? 'bi-sun-fill' : 'bi-moon-stars-fill'" aria-hidden="true"></i>
            </button>
          </li>
          <li class="nav-item user-nav"
              #userDropdownEl
              ngbDropdown
              #userDropdown="ngbDropdown"
              [open]="isOpen"
              (openChange)="isOpen = $event"
              autoClose="outside"
              *ngIf="currentUser">
            <button class="user-nav__trigger" type="button" ngbDropdownToggle [attr.aria-label]="'Menu do usuário: ' + currentUser.nome" (click)="toggleUserMenu($event)">
              <span class="user-nav__avatar">{{ getIniciais(currentUser) }}</span>
              <span class="user-nav__name">{{ formatNome(currentUser.nome) }}</span>
            </button>
            <div class="user-nav__menu dropdown-menu-end" ngbDropdownMenu>
              <div class="user-nav__header">
                <span class="user-nav__user-name">{{ currentUser.nome }}</span>
                <span class="user-nav__user-email">{{ currentUser.email }}</span>
                <span class="user-nav__user-role">{{ currentUser.perfil }}</span>
              </div>
              <div class="user-nav__divider"></div>
              <button class="user-nav__item" type="button" ngbDropdownItem>
                <i class="bi bi-person" aria-hidden="true"></i> Meu Perfil
              </button>
              <button class="user-nav__item" type="button" ngbDropdownItem>
                <i class="bi bi-sliders" aria-hidden="true"></i> Preferências
              </button>
              <button class="user-nav__item" type="button" ngbDropdownItem (click)="toggleTheme()">
                <i class="bi" [ngClass]="isDark ? 'bi-sun-fill' : 'bi-moon-stars-fill'" aria-hidden="true"></i>
                {{ isDark ? 'Modo claro' : 'Modo escuro' }}
              </button>
              <button class="user-nav__item" type="button" ngbDropdownItem>
                <i class="bi bi-info-circle" aria-hidden="true"></i> Sobre o Sistema
              </button>
              <button class="user-nav__item" type="button" ngbDropdownItem *ngIf="currentUser.perfil === 'Administrador'" routerLink="/admin">
                <i class="bi bi-gear" aria-hidden="true"></i> Administração
              </button>
              <div class="user-nav__divider"></div>
              <button class="user-nav__item user-nav__item--danger" type="button" ngbDropdownItem (click)="logout()">
                <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Sair
              </button>
              <div class="user-nav__footer">
                {{ appConfig.nomeCurto }} · v{{ versao }}
              </div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</ng-container>

<ng-template #authLoading>
  <nav class="top-bar" aria-label="Cabeçalho principal">
    <div class="top-bar__row">
      <div class="top-bar__left">
        <button
          type="button"
          class="icon-btn"
          aria-label="Alternar menu lateral"
          disabled
        >
          <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <a class="navbar-brand" aria-label="Ir para a página inicial">
          <img [src]="appConfig.logo" [alt]="appConfig.nomeCurto" />
          <div class="brand-text">
            <span class="title">{{ appConfig.nomeCurto }}</span>
            <small>{{ appConfig.subtitulo }}</small>
          </div>
        </a>
      </div>
      <div class="top-bar__center">
        <div class="global-search skeleton-search" aria-hidden="true">
          <div class="skeleton skeleton--search"></div>
        </div>
      </div>
      <div class="top-bar__right">
        <ul class="navbar-nav align-items-center">
          <li class="nav-item">
            <div class="skeleton skeleton--btn" aria-hidden="true"></div>
          </li>
          <li class="nav-item user-nav skeleton-user" aria-hidden="true">
            <div class="skeleton skeleton--avatar"></div>
            <div class="skeleton skeleton--text"></div>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</ng-template>
