<nav class="admin-header" aria-label="Cabeçalho admin">
  <div class="admin-header__left">
    <a class="admin-header__logo" routerLink="/">
      <span class="admin-header__logo-icon"><i class="bi bi-shield-check"></i></span>
      <span class="admin-header__logo-text">Admin</span>
    </a>
  </div>

  <div class="admin-header__right">
    <button class="admin-header__user-btn" aria-label="Menu do usuário">
      <span class="admin-header__user-avatar">{{ getIniciais() }}</span>
      <span class="admin-header__user-name">{{ formatNome(currentUser?.nome ?? '') }}</span>
    </button>

    <div class="admin-header__user-dropdown">
      <button class="admin-header__dropdown-item" (click)="irParaCentral()">
        <i class="bi bi-house-door"></i> Seguir para a Central
      </button>
      <button class="admin-header__dropdown-item" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i> Sair
      </button>
    </div>
  </div>
</nav>

<main class="admin-main">
  <router-outlet></router-outlet>
</main>

<footer class="admin-footer">
    {{ appConfig.nomeCurto }} · v{{ versao }}
  </footer>
