<ng-container *ngIf="!loading && !error; else loadingOrError">
  <a *ngIf="clickable && kpi.rota" [routerLink]="kpi.rota" [queryParams]="kpi.queryParams || null" class="gestor-kpi-card gestor-kpi-card--clickable">
    <ng-container *ngTemplateOutlet="cardContent"></ng-container>
  </a>
  <div *ngIf="!clickable || !kpi.rota" class="gestor-kpi-card">
    <ng-container *ngTemplateOutlet="cardContent"></ng-container>
  </div>
</ng-container>

<ng-template #loadingOrError>
  <div class="gestor-kpi-card gestor-kpi-card--loading" *ngIf="loading">
    <div class="gestor-kpi-card__skeleton"></div>
    <div class="gestor-kpi-card__skeleton gestor-kpi-card__skeleton--small"></div>
    <div class="gestor-kpi-card__skeleton gestor-kpi-card__skeleton--small"></div>
  </div>
  <div class="gestor-kpi-card gestor-kpi-card--error" *ngIf="error" role="alert">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span>{{ error }}</span>
  </div>
</ng-template>

<ng-template #cardContent>
  <div class="gestor-kpi-card__icone" [style.background]="getFundo()" [style.color]="getCor()">
    <i class="bi" [ngClass]="getIcone()"></i>
  </div>
  <div class="gestor-kpi-card__conteudo">
    <strong class="gestor-kpi-card__valor">{{ formatarValor(kpi.valor, kpi.unidade) }}</strong>
    <span class="gestor-kpi-card__rotulo">{{ kpi.rotulo }}</span>
  </div>
</ng-template>
