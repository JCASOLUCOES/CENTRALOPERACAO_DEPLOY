<div class="chat-container">
  <div class="chat-header">
    <span class="chat-title">Chat Central</span>
    <span class="chat-subtitle">Central de Operação</span>
  </div>

  <div class="chat-messages" *ngIf="history.length > 0">
    <div class="message user-message" *ngFor="let msg of history">
      <div class="message-content">{{ msg.content }}</div>
    </div>
  </div>

  <div *ngIf="loading" class="loading-state">
    <span>Gerando resposta...</span>
  </div>

  <div *ngIf="documentos.length > 0" class="documents-section">
    <h4>Documentos consultados</h4>
    <div class="documents-list">
      <span class="doc-item" *ngFor="let doc of documentos">{{ doc }}</span>
    </div>
  </div>

  <div class="input-area" *ngIf="!loading">
    <div class="input-wrapper">
      <input
        type="text"
        [(ngModel)]="message"
        (ngEnter)="enviarMensagem()"
        placeholder="Digite uma pergunta..."
        class="input-field"
        [disabled]="history.length === 0 && !loading"
      />
      <button
        class="btn-enviar"
        (click)="enviarMensagem()"
        [disabled]="!message.trim() || loading"
      >
        Enviar
      </button>
    </div>
  </div>
</div>
