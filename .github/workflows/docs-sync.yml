name: Validate Documentation Inventory

on:
  pull_request:
    branches: [developer, master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [developer]
    paths:
      - 'frontend/src/app/**/*.component.ts'
      - 'frontend/src/app/**/*.service.ts'
      - 'frontend/src/app/**/*.routes.ts'
      - 'frontend/src/app/**/*.data.ts'
      - 'backend/Central_BackEnd/Controllers/**/*.cs'
      - 'backend/Central_BackEnd/Models/**/*.cs'
      - 'backend/Central_BackEnd/Migrations/**/*.cs'
      - 'backend/Central_BackEnd/Services/**/*.cs'
      - 'backend/Central_BackEnd/Data/**/*.cs'
      - 'scripts/extract-screens.ts'

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install TypeScript runner
        run: npm install -g tsx

      - name: Extract documentation inventory
        run: npx tsx scripts/extract-screens.ts

      - name: Validate extracted inventory
        run: |
          test -f scripts/screens-data.json
          node -e "const d=require('./scripts/screens-data.json'); console.log('routes:', d.frontend.routes.length, '| components:', d.frontend.components.length, '| endpoints:', d.backend.endpoints.length, '| tables:', d.backend.tables.length, '| migrations:', d.backend.migrations.length);"
